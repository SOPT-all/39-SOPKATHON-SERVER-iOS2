plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.0.8'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '6.25.0'
}

group = 'org.sopt'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaExec).configureEach {
    jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Web / Validation / Actuator / Swagger
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

    // Spring Data JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Spring AI
    implementation platform('org.springframework.ai:spring-ai-bom:2.0.3')
    implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'

    // QueryDSL (OpenFeign)
    implementation 'io.github.openfeign.querydsl:querydsl-jpa:7.7'
    annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:7.7:jpa'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // MySQL 드라이버
    runtimeOnly 'com.mysql:mysql-connector-j'

    // 테스트
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testRuntimeOnly 'com.h2database:h2'
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // ArchUnit (아키텍처 규칙 테스트)
    testImplementation 'com.tngtech.archunit:archunit:1.5.1'
}

spotless {
    enforceCheck false
    java {
        target 'src/main/java/**/*.java', 'src/test/java/**/*.java'
        trimTrailingWhitespace()
        endWithNewline()
        removeUnusedImports()
    }
}

jacoco {
    toolVersion = "0.8.13"
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        xml.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    '**/SopkathonApplication*',
                    '**/global/config/**',
                    '**/global/swagger/**',
                    '**/dto/**',
                    '**/Q*'
            ])
        }))
    }
}
