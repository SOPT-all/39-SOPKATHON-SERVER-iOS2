app:
  s3:
    bucket: sopkathon-test-bucket
    enabled: ${S3_ENABLED:false}
    region: ${AWS_REGION:ap-southeast-2}
    upload-prefix: ${AWS_S3_UPLOAD_PREFIX:images}
    presigned-url-expiration-minutes: ${AWS_S3_PRESIGNED_URL_EXPIRATION_MINUTES:5}

  gemini:
    summary-prompt: |-
      어린이집 교사의 돌봄 기록을 학부모에게 전달할 일일 브리핑으로 정리하세요.
      따뜻하고 정중한 존댓말을 사용하고, 브리핑 본문만 작성하세요.
      기록에 없는 사실은 추가하지 말고, 시간과 수량은 원문 그대로 유지하세요.

spring:
  application:
    name: sopkathon

  profiles:
    default: dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: always
      encoding: UTF-8

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

  ai:
    google:
      genai:
        api-key: ${GEMINI_KEY}
        chat:
          options:
            temperature: 0.0

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
