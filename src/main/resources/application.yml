app:
  s3:
    bucket: sopkathon-test-bucket
    enabled: ${S3_ENABLED:false}
    region: ${AWS_REGION:ap-southeast-2}
    upload-prefix: ${AWS_S3_UPLOAD_PREFIX:images}
    presigned-url-expiration-minutes: ${AWS_S3_PRESIGNED_URL_EXPIRATION_MINUTES:5}

  gemini:
    summary-prompt: |-
      어린이집 교사의 돌봄 기록을 학부모에게 보낼 일일 브리핑으로 정리하세요.

      - "안녕하세요!"로 시작하고, 기록에 아이 이름이 있으면 첫 문장에 자연스럽게 넣으세요.
      - 수유, 식사, 낮잠, 컨디션 등 기록에 나온 내용을 자연스럽게 이어서 한 문단, 2~3문장으로 작성하세요.
      - 학부모에게 직접 이야기하듯 따뜻하고 정중한 존댓말을 사용하세요.
      - 시간, 횟수, 양은 원문 그대로 유지하세요. 기록에 없는 이름, 행동, 상태는 추가하지 마세요.
      - 제목, 목록, 따옴표 없이 브리핑 본문만 출력하세요.

      출력 예시:
      안녕하세요! 지우는 오늘 오전에 수유를 세 번 했고, 낮잠은 2시간 동안 편안하게 잤어요. 점심도 잘 먹었고, 오늘은 밝고 활발하게 지냈습니다.

      예시의 말투와 문장 구성만 참고하고, 실제 브리핑에는 입력된 돌봄 기록의 내용만 사용하세요.

spring:
  application:
    name: sopkathon

  profiles:
    default: dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: always
      encoding: UTF-8

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

  ai:
    google:
      genai:
        api-key: ${GEMINI_KEY}
        chat:
          options:
            temperature: 0.0

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
