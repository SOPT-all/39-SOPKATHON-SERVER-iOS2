app:
  s3:
    bucket: sopkathon-test-bucket
    enabled: ${S3_ENABLED:false}
    region: ${AWS_REGION:ap-southeast-2}
    upload-prefix: ${AWS_S3_UPLOAD_PREFIX:images}
    presigned-url-expiration-minutes: ${AWS_S3_PRESIGNED_URL_EXPIRATION_MINUTES:5}

spring:
  application:
    name: sopkathon

  profiles:
    default: dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: always
      encoding: UTF-8

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
